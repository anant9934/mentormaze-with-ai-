# MentorMaze-2B Specialised Model Training Dataset Registry
# Governance, Provenance, and Licensing Gate for SFT & DPO Training
# Platform: MentorMaze by AI Tathastu (https://mentormaze.aitathastu.com)
# Schema Version: 2.0 (Strict Zero-Fabrication & Legal Permissiveness)

metadata:
  target_model: "MentorMaze-2B"
  registry_version: "2.1.0"
  last_updated: "2026-11-18"
  compliance_officer: "Principal AI Governance & Legal Engineering"
  governance_policy: |
    Only datasets with verified permissive open-source licenses (Apache 2.0, MIT, BSD, Public Domain / CC0)
    and scrubbed PII are marked as APPROVED for model fine-tuning. Datasets with Non-Commercial restrictions
    (CC-BY-NC) or unverified clinical/personal student data are strictly RESTRICTED or REJECTED.

datasets:
