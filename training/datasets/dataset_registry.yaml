    declared_license: "Proprietary Curated OER / CC-BY 4.0"
    actual_license_evidence: "Aggregated public job posts, stripped of employer identifiers, imputed Randstad 2025-26 salary benchmarks."
    upstream_content_provenance: "Indian technology job postings across Bengaluru, Hyderabad, Pune, Gurgaon, and Noida."
    language: "en"
    data_size: "1,500 records (deduplicated, verified)"
    intended_use: "sft_training"
    approval_status: "APPROVED"
    download_status: "AVAILABLE_LOCAL"
    last_verification_date: "2026-11-18"
    notes: "Approved for extracting mandatory skills, experience bands, and gap roadmaps. Never used for salary guarantees."

  - dataset_id: "ds-dice-tech-jobs"
